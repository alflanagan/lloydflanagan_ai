{% extends "base.html" %}

{% block title %}Design Notes — A Lloyd Flanagan{% endblock %}

{% block page_styles %}
  <style>
    .intro-heading {
      font-family: Georgia, serif;
      font-weight: bold;
      font-size: 25px;
      color: var(--color-text-primary);
      margin: 0 0 13px;
    }

    .design-cards {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
  </style>
{% endblock page_styles %}

{% block content %}
  <h2 class="intro-heading">Design Notes</h2>

  <div class="design-cards">
    <markdown-card src="/content/philosophy.md"></markdown-card>
    <markdown-card src="/content/design-goals.md"></markdown-card>
    <markdown-card src="/content/tech-list.md"></markdown-card>
    <markdown-card src="/content/colors.md"></markdown-card>
  </div>
{% endblock %}
