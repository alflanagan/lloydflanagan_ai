<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}A Lloyd Flanagan{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playwrite+New+Zealand+Basic&display=swap"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2/cdn/themes/light.css" />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2/cdn/shoelace-autoloader.js"></script>
    <link rel="stylesheet" href="/static/css/variables.css" />
    <script type="module" src="/static/js/site-header.js"></script>
    <script type="module" src="/static/js/markdown-card.js"></script>
    {% block scripts %}
    {% endblock scripts %}
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        font-family: var(--sl-font-sans), sans-serif;
        margin: 0;
        padding: 0;
        background-color: #ecdcbb;
        background-image:
        linear-gradient(rgba(250, 243, 226, 0.55), rgba(250, 243, 226, 0.55)),
        url('/static/images/grunge-paper-background-11.jpg');
        background-size: cover;
        background-attachment: fixed;
        background-position: center;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 0 24px 70px;
      }
    </style>
    {% block page_styles %}
    {% endblock page_styles %}
  </head>
  <body>
    <site-header></site-header>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
