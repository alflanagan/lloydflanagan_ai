[project]
name = "lloydflanagan"
version = "0.1.0"
description = "Personal/Professional website for A Lloyd Flanagan"
requires-python = ">=3.14.5"
dependencies = [
    "fastapi[standard]>=0.129.0",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.1",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "djhtml>=3.0.11",
    "mypy>=2.1.0",
    "pytest>=9.0.2",
    "ruff>=0.15.1",
]

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = ["migrations"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.mypy]
cache_dir = ".mypy_cache"
warn_return_any = true
warn_unused_configs = true
mypy_path = ".venv/lib/python3.14/site-packages"

[project.scripts]
dev = "main:main"
